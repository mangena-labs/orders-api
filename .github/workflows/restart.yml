# orders-api/.github/workflows/restart.yml
name: restart
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, staging, prod]

permissions:
  contents: read
  id-token: write

jobs:
  restart:
    runs-on: ${{ vars.PRIVATE_RUNNERS == 'true' && fromJSON('{"group":"azure-private"}') || 'ubuntu-24.04' }}
    environment: ${{ inputs.environment }}       # prod still needs approval
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Rolling restart (no downtime)
        env:
          AKS_NAME: ${{ vars.AKS_NAME }}
          AKS_RG: ${{ vars.AKS_RESOURCE_GROUP }}
        run: |
          sudo az aks install-cli
          az aks get-credentials -g "$AKS_RG" -n "$AKS_NAME" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          kubectl rollout restart deployment/orders-api -n orders
          kubectl rollout status deployment/orders-api -n orders --timeout=10m
