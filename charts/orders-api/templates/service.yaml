# templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  labels:
    {{- include "orders-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "orders-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
