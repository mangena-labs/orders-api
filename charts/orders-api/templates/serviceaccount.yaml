# templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-api                                   # must match the federated credential subject
  labels:
    {{- include "orders-api.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ required "identity.apiClientId is required" .Values.identity.apiClientId | quote }}
---
# The migrator's account is a HOOK, created before the pre-install migration job runs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-migrator
  labels:
    {{- include "orders-api.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ required "identity.migratorClientId is required" .Values.identity.migratorClientId | quote }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"                       # before the job (weight 0)
    helm.sh/hook-delete-policy: before-hook-creation
