# templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  labels:
    {{- include "orders-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "orders-api.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0                              # zero-downtime rollouts
  template:
    metadata:
      labels:
        {{- include "orders-api.labels" . | nindent 8 }}
        azure.workload.identity/use: "true"          # inject the Azure token into this pod
      annotations:
        # changing the ConfigMap changes this hash, which restarts the pods to pick it up
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: orders-api
      securityContext:
        {{- include "orders-api.podSecurityContext" . | nindent 8 }}
      nodeSelector:
        workload: apps                               # the user node pool from Stage 2
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone   # spread across availability zones
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "orders-api.selectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname        # and across nodes
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "orders-api.selectorLabels" . | nindent 14 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: orders-api-config
          env:
            - name: OTEL_RESOURCE_ATTRIBUTES          # tags every log, metric and trace with release + environment
              value: "service.version={{ .Values.image.tag }},deployment.environment={{ .Values.environment }}"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30                     # up to 60 s to start
          livenessProbe:
            httpGet:
              path: /health/live                     # never checks the database
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready                    # checks the database
              port: http
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            {{- include "orders-api.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
