# templates/migration-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: orders-migrate-{{ .Release.Revision }}
  labels:
    {{- include "orders-api.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade             # runs BEFORE new pods are created
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-migrator
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: orders-migrator
      restartPolicy: Never
      securityContext:
        {{- include "orders-api.podSecurityContext" . | nindent 8 }}
      nodeSelector:
        workload: apps
      containers:
        - name: migrate
          image: "{{ .Values.migrator.repository }}:{{ .Values.image.tag }}"
          args: ["--connection", {{ include "orders-api.connectionString" . | quote }}]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            {{- include "orders-api.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
