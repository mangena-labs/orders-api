# templates/httproute.yaml: the app team's rule on the platform team's Gateway
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders-api
  labels:
    {{- include "orders-api.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ required "gateway.hostname is required" .Values.gateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          {{- with .Values.frontDoorId }}                # full design only
          headers:
            - name: X-Azure-FDID                         # only OUR Front Door profile may reach the app
              value: {{ . | quote }}
          {{- end }}
      backendRefs:
        - name: orders-api
          port: 80
