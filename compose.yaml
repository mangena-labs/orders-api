# compose.yaml: the whole stack on a laptop, including migrations, the same way as production
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12
      start_period: 20s

  migrate:
    build:
      context: .
      target: migrator
    command: ["--connection", "Server=sql;Database=Orders;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=true"]
    depends_on:
      sql:
        condition: service_healthy

  api:
    build:
      context: .
      target: final
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Orders: "Server=sql;Database=Orders;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=true"
      Webhooks__SigningKey: ${WEBHOOK_SIGNING_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully   # the API starts only after migrations succeed

volumes:
  sqldata: {}
